name: Type Check

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - ".github/workflows/type_check.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
  pull_request:
    branches: [main, release/*]
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - ".github/workflows/type_check.yaml"
      - "pyproject.toml"
      - "uv.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.7.20"

jobs:
  run_type-check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # `uv sync` builds the vrcpilot._native extension via maturin, so a
      # Rust toolchain is required even though pyright resolves _native.pyi.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # inputtino-python is fetched from git on Linux and built natively
      # against libevdev. See https://github.com/games-on-whales/inputtino/tree/stable/bindings/python
      - name: Install inputtino build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config libevdev-dev

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Check installed packages
        run: |
          echo "Python version:"
          uv run python -V
          echo "All installed packages:"
          uv pip list

      - name: Run pyright
        run: uv run pyright
