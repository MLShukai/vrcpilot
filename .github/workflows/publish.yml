name: Publish

on:
  push:
    tags: ["v*"]

env:
  UV_VERSION: "0.7.20"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-version:
    name: Verify tag matches version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Plain python3 (preinstalled, has tomllib) -- avoids triggering a
      # maturin build just to read the version.
      - name: Verify tag matches pyproject version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          PROJ=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "tag=${TAG} project=${PROJ}"
          if [ "${TAG}" != "${PROJ}" ]; then
            echo "::error::tag (${TAG}) does not match pyproject.toml version (${PROJ})"
            exit 1
          fi

  build-wheels:
    name: Build wheel (${{ matrix.platform.target }})
    needs: check-version
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        platform:
          # abi3 (cp312-abi3) -> one wheel per platform spans 3.12-3.14.
          # manylinux 2_28 baseline leaves room for PipeWire's runtime libs
          # (linked by the speaker backend in a later workstream).
          - { runner: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { runner: windows-latest, target: x64, manylinux: "auto" }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}
          path: dist/*.whl

  build-sdist:
    name: Build sdist
    needs: check-version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-to-testpypi:
    name: Publish to Test PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/vrcpilot
    permissions:
      id-token: write
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    name: Publish to PyPI
    needs: publish-to-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/vrcpilot
    permissions:
      id-token: write
    steps:
      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub Release
    needs: publish-to-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Sign distributions with sigstore
        uses: sigstore/gh-action-sigstore-python@v3.0.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Extract changelog section
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
            // Escape regex metacharacters in the version string before
            // interpolating it into the section-header pattern.
            const escaped = tag.replace(/[.+*?^${}()|[\]\\]/g, '\\$&');
            const md = fs.readFileSync('CHANGELOG.md', 'utf8');
            // Match `## [<version>] ...\n` then capture everything up to the
            // next `## [` header or end-of-string. The `m` flag is intentionally
            // omitted so `$` only anchors end-of-string (not end-of-line),
            // otherwise the capture would terminate at the first blank line.
            const headerRe = new RegExp(
              '(?:^|\\n)## \\[' + escaped + '\\][^\\n]*\\n([\\s\\S]*?)(?=\\n## \\[|$)',
            );
            const match = md.match(headerRe);
            const body = match ? match[1].trim() : `Release ${tag}`;
            fs.writeFileSync('notes.md', body);
            core.info(`Extracted ${body.length} characters of release notes for ${tag}`);

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PRE=""
          if [[ "${GITHUB_REF_NAME}" =~ (a|b|rc)[0-9]+$ ]]; then
            PRE="--prerelease"
          fi
          echo "Creating release ${GITHUB_REF_NAME} (prerelease flag: '${PRE}')"
          # shellcheck disable=SC2086
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            ${PRE} \
            ./dist/*
