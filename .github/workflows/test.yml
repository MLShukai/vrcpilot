name: Test

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - ".github/workflows/test.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
  pull_request:
    branches: [main, release/*]
    paths:
      - "**/*.py"
      - "**/*.pyi"
      - ".github/workflows/test.yml"
      - "pyproject.toml"
      - "uv.lock"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"

env:
  UV_VERSION: "0.7.20"

jobs:

  run_tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
        python-version: ["3.12", "3.13", "3.14"]

    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # The vrcpilot._native extension is built by maturin during `uv sync`,
      # so every leg needs a Rust toolchain.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # inputtino-python is fetched from git on Linux and built natively
      # against libevdev. See https://github.com/games-on-whales/inputtino/tree/stable/bindings/python
      - name: Install inputtino build dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential pkg-config libevdev-dev

      - name: Install dependencies
        run: uv sync --all-extras

      # Rust gate. `cargo test` runs with --no-default-features so the test
      # binary links libpython; `uv run` puts the project interpreter on PATH
      # for pyo3's build script.
      - name: Rust format / lint / test
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          uv run cargo test --no-default-features

      - name: Check installed packages
        run: |
          echo "Python version:"
          uv run python -V
          echo "All installed packages:"
          uv pip list

      - name: Run pytest with coverage
        run: |
          uv run pytest -v --log-level=INFO --cov
