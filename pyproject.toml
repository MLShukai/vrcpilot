[project]
name = "vrcpilot"
version = "0.1.0"
description = "Python automation toolkit for VRChat (Windows / Linux)"
readme = "README.md"
authors = [{ name = "MLShukai" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "automation",
    "game-bot",
    "input-injection",
    "ocr",
    "screen-capture",
    "vrchat",
    "win32",
    "x11",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics :: Capture :: Screen Capture",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "argcomplete>=3.5,<4",
    "inputtino-python; sys_platform == 'linux'",
    "mss>=10.2.0",
    "numpy>=2.1",
    "opencv-python>=4.10",
    "pillow>=12.2.0",
    "proc-tap>=1.0.3",
    "psutil>=7.2.2",
    "pydirectinput>=1.0.4 ; sys_platform == 'win32'",
    "pulsectl>=24.12.0 ; sys_platform == 'linux'",
    "pyperclip>=1.9",
    "python-osc>=1.8",
    "python-xlib>=0.33 ; sys_platform == 'linux'",
    "pywin32>=306 ; sys_platform == 'win32'",
    "pyyaml>=6.0.2",
    "windows-capture>=2.0.0 ; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/MLShukai/vrcpilot"
Repository = "https://github.com/MLShukai/vrcpilot"
Issues = "https://github.com/MLShukai/vrcpilot/issues"
Changelog = "https://github.com/MLShukai/vrcpilot/blob/main/CHANGELOG.md"

[project.scripts]
vrcpilot = "vrcpilot.cli:main"

[project.optional-dependencies]
ocr = [
    "rapidocr>=3.8",
    "onnxruntime>=1.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.2.0",
    "pyright>=1.1.398",
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.0",
    "types-python-xlib>=0.33; sys_platform == 'linux'",
    "types-pywin32>=311.0.0.20260408 ; sys_platform == 'win32'",
    "types-pyyaml>=6.0.12.20260408",
]


[tool.pytest.ini_options]
addopts = [
  "--color=yes",
  "--durations=0",
  "--strict-markers",
  "--doctest-modules",
  "--ignore=tests/e2e",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
log_cli = true
log_level = "INFO"

minversion = "6.0"
testpaths = "tests/"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "e2e: scenarios that require a real VRChat instance; not collected by default",
]

[tool.pyright]
pythonVersion = "3.12"
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "**/.venv",
  "tests/vrcpilot/",
  ".claude/worktrees/",
]
strict = ["./src/"]
reportMissingTypeStubs = false
# Windows ホストでは python-xlib 本体は install されず stubs のみで型解決する
# ため source の欠落警告は想定内。Linux 側は本体も入るので発火しない。
reportMissingModuleSource = false
reportImplicitOverride = true
reportPrivateUsage = "warning"

[tool.ruff]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.12
target-version = "py312"

include = ["*.py"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".ipynb_checkpoints",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    ".vscode",
    "build",
    "dist",
    "node_modules",
    ".venv",
]

# Linter ignore codes
[tool.ruff.lint]

select = [
  "E",
  "F",
  "W",
  "I",
]

ignore = [
  "E203", # Whitespace before ':' (E203)
  "E402", # Module level import not at top of file.
  "E501", # Line too long (82 &gt; 79 characters) (E501)
  "F811", # Redefinition of unused name from line n (F811)
  "E741", # Do not define classes named 'I', 'O', or 'l' (E742)
  "E266", # too many leading '#' for block comment (E266)
  "F401", # Module imported but unused,
]


[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

[tool.coverage.run]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == __main__:",
    "pass",
    "raise ImportError",
]

[tool.uv.sources]
inputtino-python = { git = "https://github.com/games-on-whales/inputtino.git", subdirectory = "bindings/python" }
